[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
listen = /tmp/h5ai/php-fpm.sock
listen.mode = 0660
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/1
